name: Godot validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import Godot assets
        run: godot --headless --path . --editor --import --quit
      - name: Check scenes and scripts
        run: godot --headless --path . --editor --quit
      - name: Run salvage economy tests
        run: godot --headless --path . --script res://tests/test_salvage.gd
      - name: Run restoration tests
        run: godot --headless --path . --script res://tests/test_restoration.gd
      - name: Run detachable parts inventory tests
        run: godot --headless --path . --script res://tests/test_parts_inventory.gd
      - name: Run customisation tests
        run: godot --headless --path . --script res://tests/test_customisation.gd
      - name: Run workshop bay tests
        run: godot --headless --path . --script res://tests/test_workshop_bays.gd
      - name: Run interactive restoration tests
        run: godot --headless --path . --script res://tests/test_restoration_tasks.gd
      - name: Run player progression tests
        run: godot --headless --path . --script res://tests/test_player_progress.gd
      - name: Run junkyard zone tests
        run: godot --headless --path . --script res://tests/test_junkyard_zones.gd
      - name: Run junkyard stock tests
        run: godot --headless --path . --script res://tests/test_yard_stock.gd
      - name: Run vehicle condition tests
        run: godot --headless --path . --script res://tests/test_vehicle_condition.gd
