name: Godot validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import Godot assets
        run: godot --headless --path . --editor --import --quit
      - name: Check scenes and scripts
        run: godot --headless --path . --editor --quit
      - name: Run salvage economy tests
        run: godot --headless --path . --script res://tests/test_salvage.gd
